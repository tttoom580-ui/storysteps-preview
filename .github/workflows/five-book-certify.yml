name: Certify five full 25-chapter bilingual AI-reviewed novels
on:
  push:
    branches: [main]
    paths:
      - 'scripts/certify_five_books_20261114.py'
      - 'scripts/check_five_book_evidence.py'
      - 'verification/five-book-editorial/ai-readthrough-notes-20261114.json'
      - '.github/workflows/five-book-certify.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: storysteps-five-book-certification
  cancel-in-progress: false
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Create and verify all 125 source-locked bilingual receipts, then release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm install --no-audit --no-fund
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            if python3 -c "import json; j=json.load(open('verification/editorial-approvals.json')); exit(0 if len(j.get('certifiedBooks',{}))==5 else 1)"; then
              python3 scripts/check_editorial_certification.py
              python3 scripts/check_five_book_evidence.py
              echo 'All five source-locked certificates already exist.'
              exit 0
            fi
            python3 scripts/edit_five_books_20261114.py
            python3 scripts/certify_five_books_20261114.py
            npm run build
            node verification/ad-policy-smoke.mjs
            node verification/offer-smoke.mjs
            printf '{"sourceCommit":"%s"}\n' "$(git rev-parse HEAD)" > docs/release.json
            git add -A public/books public/catalog.js public/content-manifest.json public/five-book-ai-certification.html verification/editorial-approvals.json verification/five-book-editorial docs
            if git diff --cached --quiet; then
              echo 'All source-locked approvals are already published.'
              exit 0
            fi
            git commit -m 'editorial: certify five 25-chapter novels with 125 AI review receipts [skip ci]'
            if git push origin HEAD:main; then
              echo 'Published five complete AI-reviewed certificates and all evidence.'
              exit 0
            fi
            echo 'Main changed during push; retrying source-locked review.'
          done
          exit 1
