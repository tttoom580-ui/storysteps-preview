name: StorySteps editorial depth triage
on:
  push:
    paths:
      - 'scripts/audit_editorial_depth.py'
      - '.github/workflows/editorial-depth.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: story-editorial-depth
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Audit all published manuscripts
        run: python3 scripts/audit_editorial_depth.py
      - name: Persist the exact per-book and per-chapter findings
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/audit_editorial_depth.py > /tmp/editorial-summary.txt
            git add verification/editorial-triage-20261114.json
            if git diff --cached --quiet; then
              echo 'Editorial report already current'
              exit 0
            fi
            git commit -m 'audit: publish 82-book machine editorial triage [skip ci]'
            if git push origin HEAD:main; then
              cat /tmp/editorial-summary.txt | grep EDITORIAL_TRIAGE_SUMMARY
              exit 0
            fi
            sleep 2
          done
          exit 1
