name: Build StorySteps GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'public/**'
      - 'index.html'
      - 'main.tsx'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/build-site.yml'
      - 'verification/browser-smoke.mjs'
      - 'verification/sync-api-smoke.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: storysteps-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Install dependencies and browser once
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build, audit and browser smoke test
        run: |
          npm run build
          timeout 100s node verification/browser-smoke.mjs
          timeout 90s node verification/sync-api-smoke.mjs
      - name: Publish only the latest verified source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            # The remote may advance while browser tests run or while publishing.
            git fetch origin main
            git reset --hard origin/main
            npm run build
            # Confirm the code being published is the code checked in and tested.
            timeout 100s node verification/browser-smoke.mjs
            printf '{"sourceCommit":"%s"}\n' "$(git rev-parse HEAD)" > docs/release.json
            git add -A docs
            if git diff --cached --quiet; then
              echo 'Current generated files are already published.'
              exit 0
            fi
            git commit -m 'build: publish tested StorySteps pages [skip ci]'
            if git push origin HEAD:main; then
              echo 'Published tested StorySteps build.'
              exit 0
            fi
            echo "Main advanced during push (attempt $attempt), rebuilding from latest source."
            sleep 2
          done
          echo 'Unable to publish after four retries; previous live site preserved.' >&2
          exit 1
