name: Build StorySteps GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'public/**'
      - 'index.html'
      - 'main.tsx'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/build-site.yml'
      - 'verification/browser-smoke.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: storysteps-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Build site and run required checks
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install smoke test browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Desktop and mobile-emulated interaction smoke tests
        run: node verification/browser-smoke.mjs
      - name: Commit generated GitHub Pages files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Subsequent content edits may land while build is running.
          # Rebuild from the current main so a stale artifact can never overwrite newer files.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git reset --hard origin/main
            npm run build
            node verification/browser-smoke.mjs
          fi
          git add -A docs
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish generated StorySteps pages [skip ci]'
            git push origin HEAD:main
          fi
