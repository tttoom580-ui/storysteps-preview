name: Build StorySteps GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'premium-service/**'
      - 'verification/premium-api-smoke.mjs'
      - 'config/**'
      - 'verification/offer-smoke.mjs'
      - 'verification/dictionary-smoke.mjs'
      - 'scripts/**'
      - 'public/**'
      - 'incoming/batch11/**'
      - 'incoming/batch15/**'
      - 'index.html'
      - 'main.tsx'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/build-site.yml'
      - 'verification/browser-smoke.mjs'
      - 'verification/launch-flow-smoke.mjs'
      - 'verification/sync-api-smoke.mjs'
      - 'verification/ad-policy-smoke.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: storysteps-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Install JavaScript dependencies
        timeout-minutes: 3
        run: npm install --no-save --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=2 playwright
      - name: Install browser and video tools
        timeout-minutes: 3
        run: |
          npx playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Build, audit and browser smoke test
        run: |
          python3 scripts/import_batch15.py
          npm run build
          node verification/ad-policy-smoke.mjs
          node verification/chapter-practice-smoke.mjs
          node verification/offer-smoke.mjs
          node verification/premium-api-smoke.mjs
          node verification/dictionary-smoke.mjs
          timeout 100s node verification/browser-smoke.mjs
          timeout 100s node verification/launch-flow-smoke.mjs
          timeout 90s node verification/sync-api-smoke.mjs
      - name: Publish only the latest verified source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            # The remote may advance while browser tests run or while publishing.
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/import_batch15.py
            npm run build
            node verification/ad-policy-smoke.mjs
            node verification/chapter-practice-smoke.mjs
            node verification/offer-smoke.mjs
            node verification/premium-api-smoke.mjs
            node verification/dictionary-smoke.mjs
            # Confirm the code being published is the code checked in and tested.
            timeout 100s node verification/browser-smoke.mjs
            timeout 100s node verification/launch-flow-smoke.mjs
            printf '{"sourceCommit":"%s"}\n' "$(git rev-parse HEAD)" > docs/release.json
            timeout 120s node scripts/record-reading-demos.mjs
            git add -A docs public/demos public/catalog.js public/content-manifest.json public/books/ss-r15-* app/story-previews.json app/reading-guide.json app/reading-guide-samples.json verification/import-batch15.json
            if git diff --cached --quiet; then
              echo 'Current generated files are already published.'
              exit 0
            fi
            git commit -m 'build: publish tested StorySteps pages [skip ci]'
            if git push origin HEAD:main; then
              echo 'Published tested StorySteps build.'
              exit 0
            fi
            echo "Main advanced during push (attempt $attempt), rebuilding from latest source."
            sleep 2
          done
          echo 'Unable to publish after four retries; previous live site preserved.' >&2
          exit 1

      - name: Deploy verified site to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3f1d5c8ecec11ca0ebd45457a7a5aa24
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Cloudflare Pages deployment requires the CLOUDFLARE_PAGES_API_TOKEN repository secret."
            exit 0
          fi
          python3 scripts/prepare_cloudflare_pages.py "$RUNNER_TEMP/storysteps-pages" --site storysteps-5ef.pages.dev
          npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/storysteps-pages" --project-name storysteps --branch main
