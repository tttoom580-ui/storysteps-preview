name: StorySteps one-time source and full-history export
on:
  push:
    branches:
      - 'archive/export-20261121'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect all branches and create offline restore files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
          mkdir -p backup-export
          git bundle create backup-export/StorySteps-full-history.bundle --all
          tar -czf backup-export/StorySteps-working-tree.tar.gz --exclude=.git --exclude=backup-export .
          git rev-parse HEAD > backup-export/HEAD_SHA.txt
          git branch -a > backup-export/GIT_BRANCHES.txt
          sha256sum backup-export/StorySteps-full-history.bundle backup-export/StorySteps-working-tree.tar.gz > backup-export/SHA256SUMS.txt
      - name: Export source code as downloadable backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: storysteps-full-repository-export
          path: backup-export/
          retention-days: 7
          compression-level: 0
